"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

file_include_globs = """
.env
.streamlit/secrets.toml
"""

[scripts]
setup = "python3 -m venv .venv && . .venv/bin/activate && python -m pip install -r requirements.txt"
archive = "rm -rf .venv .pytest_cache && find . -type d -name __pycache__ -prune -exec rm -rf {} +"
run_mode = "concurrent"

[scripts.run.app]
command = "./.venv/bin/python -m streamlit run app.py --server.port $CONDUCTOR_PORT --server.headless true"
default = true
icon = "monitor"

[scripts.run.smoke]
command = "./.venv/bin/python scripts/smoke_test.py"
icon = "test-tube"
